[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-asset-platform-backend"
version = "0.1.0"
description = "数字资产管理中台 API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=43,<47",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "openapi-spec-validator>=0.7,<1",
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
